[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt_llm"
dynamic = ["version"]
dependencies = []

authors = [
  { name="Reego Software", email="reego.software@gmail.com" },
]
description = "A zero-dependency CLI tool to prompt LLMs by reego.software"
keywords = ["llm", "cli", "openai", "anthropic", "claude", "gemini", "mistral", "groq", "ollama", "tool-calling"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/rs-usr/prompt_llm"
Issues = "https://github.com/rs-usr/prompt_llm/issues"

[project.scripts]
prompt_llm = "prompt_llm.cli:main"

[tool.hatch.version]
path = "src/prompt_llm/__init__.py"
